# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.yml — Pentest Toolbox
# Compatible : linux/amd64 · linux/arm64 (Pi 4/5) · linux/arm/v7 (Pi 3)
#
# AVANT LE PREMIER LANCEMENT :
#   ./setup-secret.sh        → génère .env avec REPORT_SECRET_HEX (une fois)
#   docker compose up -d --build
#
# Le secret persiste dans .env (jamais régénéré au rebuild), donc les
# rapports .enc restent lisibles entre toutes les versions de l'image.
# ─────────────────────────────────────────────────────────────────────────────

services:
  toolbox:
    build:
      context: .
      dockerfile: Dockerfile
      # Le build arg reste disponible en fallback si .env est absent
      # (cas d'un `docker build` direct sans compose).
      args:
        REPORT_SECRET_HEX: ""

    image: toolbox:latest
    container_name: pentest-toolbox

    volumes:
      - ./scripts:/app/scripts
      # [FIX] L'app écrit dans /app/data/reports. Le Dockerfile crée et
      # chown ce répertoire (pentest:pentest) et déclare
      # VOLUME ["/app/data/reports"]. Au premier démarrage, Docker copie
      # le contenu + permissions du répertoire image dans ce volume nommé,
      # donc l'utilisateur non-root pentest peut y écrire.
      - reports:/app/data/reports

    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW

    # network_mode: host -> accès direct aux interfaces réseau de l'hôte,
    # nécessaire pour nmap/arpwatch/tshark. Incompatible avec `ports:`.
    network_mode: host

    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec

    security_opt:
      - no-new-privileges:true

    restart: unless-stopped

    # GPU pour hashcat (optionnel) — décommente selon ton hardware :

    # NVIDIA (amd64 / arm64) :
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

    # AMD / Intel via DRI (amd64 / arm64) :
    # devices:
    #   - /dev/dri:/dev/dri

    # platform: linux/amd64
    # platform: linux/arm64
    # platform: linux/arm/v7

volumes:
  reports:
    driver: local